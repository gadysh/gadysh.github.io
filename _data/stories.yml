# Picture stories for scenario pages (before → magic transition → after).
# Full guide (fields, image sizes, safe zones, checklist): _dev/STORY_ENGINE_GUIDE.md
# Rendered by _includes/story-player.html (poster + full-screen player) and played by assets/js/story.js.
# A scenario page shows its story when its front matter has `story: <id>` and this file has <id>.<lang>.
#
# Per frame: chapter, image (16:9), optional image_portrait (9:16, phones), focus / focus_portrait
# (CSS object-position, the point kept in view when cropped), alt, title, text, optional time,
# human (a person decides) and duration (ms, overrides interval).
# Images are optimized landscape/portrait WebP illustrations; audio and timed captions are optional.

