  icon: "mic"
  published: true
  evidence:
    approved: false
  he:
    title: "כמה תוצרים מהקלטה אחת"
    short: "תוצרי AI מהקלטת שיחה או פגישה"
    outcome: "מהקלטה של שיחת טלפון, פגישה או שיחת מכירה מתקבלים כמה תוצרים: סיכום ללקוח, תיעוד ב־CRM, המלצה להמשך, וניתוח איכות ולמידה."
  en:
    title: "Several outputs from one recording"
    short: "AI outputs from a call or meeting recording"
