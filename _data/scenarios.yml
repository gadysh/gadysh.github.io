  en:
    title: "Insurance claims with documents and photos, handed off with full context"
    short: "Insurance intake and documents"
    outcome: "The customer starts on WhatsApp. The digital agent finds the case, adds photos and documents, flags missing items, and hands the file to an insurance representative for review."

- slug: "recording-to-outputs"
  primary_domain: "customers"
  domains:
    - "customers"
