  icon: "chat"
  published: true
  evidence:
    approved: false
  he:
    title: "שירות ב־WhatsApp שמבצע את הפעולה עבור הלקוח"
    short: "שירות ופעולות ב־WhatsApp"
    outcome: "לקוחות פונים בערוץ שהם כבר משתמשים בו. הסוכן מברר, מבצע את הפעולה במערכות, ומעביר לנציג רק את מה שבאמת צריך אדם."
  en:
    title: "WhatsApp service that carries out the action for the customer"
    short: "WhatsApp service and actions"
    outcome: "Customers reach you on a channel they already use. The agent clarifies the request, carries out the action in your systems, and hands over to a person only what truly needs one."

- slug: "agent-assist-onboarding"
  primary_domain: "customers"
  domains:
