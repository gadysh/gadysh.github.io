<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    body { margin: 0; padding: 20px; background: #ffffff; font-family: 'Heebo', sans-serif; }
    .box { margin-bottom: 24px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; display: inline-block; background: #fff; }
    .title { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    #render-header-38 { display: inline-block; }
    #render-drawer-32 { display: inline-block; }
    #render-favicon-16 { display: inline-block; }
    #render-favicon-32 { display: inline-block; }
    .drawer-logo-box {
      width: 32px;
      height: 32px;
      display: inline-block;
    }
    .drawer-logo-box img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: contain;
      display: block;
    }
    .favicon-16-box {
      width: 16px;
      height: 16px;
      display: inline-block;
    }
    .favicon-16-box img {
      width: 16px;
      height: 16px;
      display: block;
    }
    .favicon-32-box {
      width: 32px;
      height: 32px;
      display: inline-block;
    }
    .favicon-32-box img {
      width: 32px;
      height: 32px;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Header 38px using exact site classes -->
  <div class="box">
    <div class="title">Header 38px</div>
    <div id="render-header-38" class="site-header" style="background:transparent;border:none;box-shadow:none;padding:0;">
      <a class="brand" style="margin:0;padding:0;">
        <img src="/assets/logo-symbol.png" alt="PowOrg logo" width="38" height="38">
      </a>
    </div>
  </div>

  <!-- Drawer 32px -->
  <div class="box">
    <div class="title">Drawer 32px</div>
    <div id="render-drawer-32" class="drawer-logo-box">
      <img src="/assets/logo-symbol.png" alt="PowOrg logo" width="32" height="32">
    </div>
  </div>

  <!-- Favicon 16px -->
  <div class="box">
    <div class="title">Favicon 16px</div>
    <div id="render-favicon-16" class="favicon-16-box">
      <img src="/assets/icons/favicon.png" alt="Favicon 16px">
    </div>
  </div>

  <!-- Favicon 32px -->
  <div class="box">
    <div class="title">Favicon 32px</div>
    <div id="render-favicon-32" class="favicon-32-box">
      <img src="/assets/icons/favicon.png" alt="Favicon 32px">
    </div>
  </div>
</body>
</html>
