<button type="button" class="cube-invitation" data-cube-open aria-haspopup="dialog" aria-controls="cube-chat" aria-expanded="false" hidden>
  <span class="cube-invitation-bubble">
    <span class="cube-invitation-signal" aria-hidden="true"></span>
    <span>{% if include.lang == "he" %}נסה אותי{% else %}Try me{% endif %}</span>
  </span>
</button>
<div class="cube-portal" aria-hidden="true">
  <div class="cube-portal-door">
    <div class="cube-door-front"></div>
    <div class="cube-door-back"></div>
  </div>
</div>
<div class="cube-chat-link" aria-hidden="true"></div>
