<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PowOrg's pilot project: how we prove real, measurable value and savings for your organization in just 6-8 weeks.">

  <title>PowOrg - Pilot project</title>

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Heebo', -apple-system, sans-serif; }

    main { padding-top: var(--header-height); }

    .page-hero {
      padding: 4.5rem 0 2.5rem 0;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
    }

    .page-hero .container { position: relative; z-index: 2; }

    .page-hero h1 {
      font-size: clamp(2.4rem, 3.2vw, 3.2rem);
      margin-bottom: 0.75rem;
    }

    .page-hero p {
      max-width: 70ch;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .poc-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .md-card {
      padding: 2.25rem;
    }

    .md-content h2 {
      font-size: 1.6rem;
      margin: 2.1rem 0 0.75rem 0;
    }
    .md-content h3 {
      font-size: 1.25rem;
      margin: 1.6rem 0 0.6rem 0;
      color: var(--primary);
    }
    .md-content p {
      margin: 0 0 1rem 0;
      max-width: 75ch;
    }
    .md-content ul, .md-content ol {
      margin: 0 0 1.1rem 0;
      padding-inline-start: 1.25rem;
      color: var(--text-muted);
    }
    .md-content li { margin: 0.35rem 0; }
    .md-content hr {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 2rem 0;
    }
    .md-content strong { color: var(--text-main); }

    .md-content h2, .md-content h3, .md-content h4 { scroll-margin-top: 110px; }

    .cta-card {
      margin-top: 1.75rem;
      padding: 1.75rem;
      border-radius: var(--radius-card);
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .cta-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    @media (max-width: 1024px) {
      .page-hero { padding: 3.5rem 0 2rem 0; }
      .md-card { padding: 1.5rem; }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" style="display: flex; align-items: center; gap: 10px;">
        <img src="../assets/img/poworg-logo.jpg" alt="PowOrg" style="height: 52px; width: 52px; border-radius: 10px; object-fit: cover;">
        <span>PowOrg</span>
      </a>

      <button class="nav-toggle" aria-label="Menu">☰</button>

      <ul class="nav-menu">
        <li><a href="../index.html#hero" class="nav-link" data-i18n="nav.home"></a></li>
        <li><a href="../index.html#process" class="nav-link" data-i18n="nav.process"></a></li>
        <li><a href="../index.html#use-cases" class="nav-link" data-i18n="nav.solutions"></a></li>
        <li><a href="poc.html" class="nav-link active" aria-current="page" data-i18n="nav.poc"></a></li>
        <li><a href="security.html" class="nav-link" data-i18n="nav.security"></a></li>
        <li><button type="button" id="lang-toggle-btn" class="lang-toggle-btn" aria-label="Switch language"></button></li>
        <li><a href="../index.html#contact" class="btn btn-primary" style="padding: 0.6rem 1.5rem; color: #ffffff;" data-i18n="nav.contact"></a></li>
      </ul>
    </div>
  </nav>

  <main>
    <header class="page-hero">
      <div class="container">
        <h1 data-i18n="page.poc.h1"></h1>
        <p data-i18n="page.poc.lead"></p>
      </div>
    </header>

    <section style="padding-top: 2.5rem;">
      <div class="container poc-layout">

        <article class="clean-card md-card">
          <div id="poc-md" class="md-content"></div>

          <section class="cta-card" aria-label="Contact">
            <h3 style="margin:0 0 0.5rem 0;" data-i18n="page.poc.cta.title"></h3>
            <p style="margin:0;" data-i18n="page.poc.cta.body"></p>
            <div class="cta-actions">
              <a class="btn btn-primary" href="../index.html#contact" data-i18n="page.poc.cta.primary"></a>
              <a class="btn btn-secondary" href="../index.html#contact" data-i18n="page.poc.cta.secondary"></a>
            </div>
          </section>
        </article>

      </div>
    </section>
  </main>

  <footer class="footer-clean">
    <div class="container">
      <p data-i18n-html="page.footer.rights"></p>
      <p style="margin-top: 0.5rem;">
        <a href="security.html" data-i18n="page.footer.security"></a> ·
        <a href="poc.html" data-i18n="page.footer.poc"></a>
      </p>
    </div>
  </footer>

  <script type="module">
    import { getLang, initLangToggle } from '../js/i18n.js';

    initLangToggle();

    // Mobile menu
    const toggle = document.querySelector('.nav-toggle');
    const menu = document.querySelector('.nav-menu');
    if (toggle && menu) toggle.addEventListener('click', () => menu.classList.toggle('active'));

    // Markdown content — English by default, Hebrew source file when toggled.
    const target = document.getElementById('poc-md');
    if (window.marked) marked.setOptions({ gfm: true, breaks: false });

    async function loadPocMarkdown() {
      const file = getLang() === 'he' ? '../content/poc.md' : '../content/poc.en.md';
      try {
        const res = await fetch(file, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const md = await res.text();
        const html = window.marked ? marked.parse(md) : md;

        const tmp = document.createElement('div');
        tmp.innerHTML = html;

        const firstH1 = tmp.querySelector('h1');
        if (firstH1) firstH1.remove();

        target.innerHTML = tmp.innerHTML;
      } catch (err) {
        target.innerHTML = `
          <p style="color: var(--text-muted);">
            We couldn't load the pilot project content. Make sure the file exists at: <strong>${file}</strong>
          </p>
        `;
      }
    }

    loadPocMarkdown();
  </script>
</body>
</html>
